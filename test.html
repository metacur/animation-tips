<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テキストを枠線で囲む</title>
  <style>
    /* 全体のレイアウト調整（デモ用） */
    body {
      font-family: sans-serif;
      padding: 50px;
      background-color: #f5f5f5;
    }

    /* 方法1: divを使った例（ブロック要素） */
    .box-div {
      /* 枠線の設定: 太さ 線の種類 色 */
      border: 2px solid #333;
      
      /* 幅を指定（テキストに合わせて調整可能） */
      width: 200px;
      
      /* 高さを指定 */
      height: 80px;
      
      /* 左右中央配置: テキストを水平方向の中央に */
      text-align: center;
      
      /* 上下中央配置: Flexboxを使用 */
      display: flex;
      align-items: center; /* 垂直方向の中央 */
      justify-content: center; /* 水平方向の中央（text-alignと併用可） */
      
      /* 余白やその他の装飾 */
      margin-bottom: 30px;
      background-color: white;
    }

    /* 方法2: spanを使った例（インライン要素→ブロック化） */
    .box-span {
      /* インライン要素をブロック化 */
      display: inline-flex;
      
      /* 枠線 */
      border: 2px solid #0066cc;
      
      /* パディングで内側の余白を確保 */
      padding: 20px 40px;
      
      /* 中央配置 */
      align-items: center;
      justify-content: center;
      
      /* 装飾 */
      background-color: white;
      margin-bottom: 30px;
    }

    /* 方法3: シンプルな固定サイズ版 */
    .box-simple {
      border: 2px solid #009900;
      width: 180px;
      height: 60px;
      
      /* line-heightで上下中央を実現する古典的な方法 */
      line-height: 60px; /* heightと同じ値にする */
      text-align: center;
      
      background-color: white;
    }
  </style>
</head>
<body>
  <h2>テキストを枠線で囲んで中央配置する例</h2>

  <!-- 方法1: divを使った例 -->
  <div class="box-div">
    サンプル文字
  </div>

  <!-- 方法2: spanを使った例 -->
  <span class="box-span">
    テスト表示
  </span>
  <br><br>

  <!-- 方法3: シンプルな方法 -->
  <div class="box-simple">
    中央配置
  </div>

</body>
</html>
